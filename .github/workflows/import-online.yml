name: Import online tournaments

# Every day, imports new online tournaments from Limitless's API into
# production. Each run resumes from the newest online event already
# imported, so it makes a few requests. Run it by hand from the Actions tab.

on:
  schedule:
    # 09:00 UTC daily: IMPORT_CRON in packages/core/src/config.ts, which a
    # test keeps this in step with.
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Never two imports at once; a new run waits for the last.
concurrency:
  group: production-data
  cancel-in-progress: false

jobs:
  online:
    name: online
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Production secrets live in this environment, available only to main.
    environment: production
    env:
      # The site's exact address, without redirects (a GitHub variable).
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Imports, recounts the stored totals, then tells the site its data
      # changed (SITE_URL, REVALIDATE_SECRET).
      - run: pnpm import:online --prod --yes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      # Load the busiest pages, so the first visitor gets cached results.
      - run: pnpm --filter @ots/tools warm-cache
