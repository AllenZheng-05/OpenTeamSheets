name: Import tournaments

# Every day, imports new tournaments into production:
# - online tournaments from Limitless's API, resuming from the newest one
#   already imported, so it makes a few requests;
# - official events from Limitless VGC's standings site: any newer than
#   every event listed or imported, once finished and settled. A new
#   Regional reads about 1,000 teamlist pages, one a second.
# Run it by hand from the Actions tab.

on:
  schedule:
    # 09:00 UTC daily: IMPORT_CRON in packages/core/src/config.ts, which a
    # test keeps this in step with.
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Never two imports at once; a new run waits for the last.
concurrency:
  group: production-data
  cancel-in-progress: false

jobs:
  import:
    name: import
    runs-on: ubuntu-latest
    # Room for a weekend with two large official events.
    timeout-minutes: 180
    # Production secrets live in this environment, available only to main.
    environment: production
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # Each import tells the site its data changed when it's done.
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      # The site's exact address, without redirects (a GitHub variable).
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Each import recounts the stored totals, then tells the site.
      - run: pnpm import:online --prod --yes
      # Runs even if the online import failed: the sources are separate.
      - if: success() || failure()
        run: pnpm import:limitless --discover --prod --yes
      # Load the busiest pages, so the first visitor gets cached results.
      - if: success() || failure()
        run: pnpm --filter @ots/tools warm-cache
